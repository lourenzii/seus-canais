<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Carregando live…</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: #0d0d11; color: #f4f4f6; font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  .box { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px; }
  .m { width: 120px; height: 120px; }
  .m svg { width: 120px; height: 120px; overflow: visible; }
  b { font-size: 18px; font-weight: 700; }
  span { font-size: 13px; color: #a3a3ae; }
  .bar { width: 160px; height: 4px; border-radius: 4px; background: #24242c; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #8b7fff; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .dg .dg-all { transform-box: fill-box; transform-origin: 50% 100%; animation: breathe 3.2s ease-in-out infinite; }
  .dg .dg-wing { transform-box: fill-box; transform-origin: 100% 100%; animation: flap 3.2s ease-in-out infinite; }
  .dg-wave .dg-arm-wave { transform-box: fill-box; transform-origin: 20% 90%; animation: wave .9s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.02, .975) translateY(1px); } }
  @keyframes flap { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-8deg); } }
  @keyframes wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-28deg); } }
  @media (prefers-reduced-motion: reduce) { .dg *, .bar i { animation: none !important; } }
</style>
</head>
<body>
  <div class="box">
    <div class="m" id="m"></div>
    <b id="t">Carregando live…</b>
    <span id="h"></span>
    <div class="bar"><i></i></div>
  </div>
  <script src="i18n.js"></script>
  <script src="mascot.js"></script>
  <script src="loading.js"></script>
</body>
</html>
